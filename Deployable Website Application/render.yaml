# Render Blueprint — Deploy ScamHisn AI (حصن الاحتيال)
# Docs: https://docs.render.com/blueprint-spec
services:
  - type: web
    name: scamhisn-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_CONCURRENT_SCANS
        value: "2"
      - key: CORS_ALLOW_EXTENSIONS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Prompted securely in Render's Environment Variables dashboard (never committed)
      - key: GEMINI_API_KEY
        sync: false
