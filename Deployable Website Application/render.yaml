# Render Blueprint — Deploy ScamHisn AI (حصن الاحتيال)
# Docs: https://docs.render.com/blueprint-spec
services:
  - type: web
    name: scamhisn-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_CONCURRENT_SCANS
        value: "2"
      - key: CORS_ALLOW_EXTENSIONS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Prompted securely in Render's Environment Variables dashboard (never committed)
      - key: GEMINI_API_KEY
        sync: false
      # --- AI fallback chain (all optional; see docs/AI_FALLBACK_SETUP.md) ---
      # A second team member's Gemini key, tried when the first is rate limited
      - key: GEMINI_API_KEY_2
        sync: false
      # A second Gemini model, tried when the primary is overloaded (limits are per model)
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      # Self-hosted OpenAI-compatible model (e.g. Jais 2), tried when every Gemini option fails
      - key: LOCAL_LLM_BASE_URL
        sync: false
      - key: LOCAL_LLM_MODEL
        sync: false
      - key: LOCAL_LLM_API_KEY
        sync: false
