<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210" role="img" aria-label="Live Website Flow">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1218"/>
      <stop offset="100%" stop-color="#0f1b24"/>
    </linearGradient>
    <linearGradient id="mid1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2620"/>
      <stop offset="100%" stop-color="#0a1c19"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="20%" stop-color="#e11d48"/>
      <stop offset="20%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="918" height="208" rx="20" fill="url(#bg1)" stroke="#1e303e" stroke-width="1.5"/>
  <rect x="28" y="1" width="110" height="3.5" rx="1.75" fill="url(#bar1)"/>
  <text x="28" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LIVE WEBSITE</text>

  <!-- Step 1 -->
  <rect x="28" y="48" width="230" height="136" rx="16" fill="#111c26" stroke="#223444" stroke-width="1.2"/>
  <text x="143" y="88" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">STEP 1</text>
  <text x="143" y="122" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">Link or Image</text>
  <text x="143" y="148" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">User Submits</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="266" y1="116" x2="300" y2="116" stroke="#10b981" stroke-width="2.4" stroke-linecap="round"/>
  <polyline points="294,109 302,116 294,123" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="310" y="48" width="300" height="136" rx="16" fill="url(#mid1)" stroke="#059669" stroke-width="1.6"/>
  <text x="460" y="76" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">ScamHisn AI</text>

  <rect x="328" y="90" width="126" height="76" rx="11" fill="#091815" stroke="#1e463b" stroke-width="1"/>
  <text x="391" y="118" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Deterministic</text>
  <text x="391" y="140" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">SSL · Domain</text>
  <text x="391" y="155" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sandbox</text>

  <rect x="466" y="90" width="126" height="76" rx="11" fill="#091815" stroke="#1e463b" stroke-width="1"/>
  <text x="529" y="118" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Semantic AI</text>
  <text x="529" y="140" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Red Flags</text>
  <text x="529" y="155" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Image Forgery</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="618" y1="116" x2="652" y2="116" stroke="#10b981" stroke-width="2.4" stroke-linecap="round"/>
  <polyline points="646,109 654,116 646,123" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="662" y="48" width="230" height="136" rx="16" fill="#111c26" stroke="#223444" stroke-width="1.2"/>
  <text x="777" y="88" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">RESULT</text>
  <text x="777" y="122" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">0–100% Score</text>
  <text x="777" y="148" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">Details · PDF · Police</text>
</svg>
