  <text x="342" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">(e.g. Vehicles: "All good, no fines.")</text>

  <!-- ARROW 2 -> 3 -->
  <line x1="612" y1="151" x2="644" y2="151" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="638,145 645,151 638,157" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STEP 3 CARD -->
  <rect x="652" y="52" width="240" height="198" rx="16" fill="#111c26" stroke="#223444" stroke-width="1.2"/>
  <rect x="668" y="68" width="28" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="682" y="87" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">3</text>
  <text x="706" y="87" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Instant Proof</text>

