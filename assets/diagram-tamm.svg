  <line x1="274" y1="151" x2="306" y2="151" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="300,145 307,151 300,157" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

