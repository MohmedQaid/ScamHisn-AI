  <text x="892" y="34" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Conceptual User Flow</text>

  <!-- STEP 1 CARD -->
  <rect x="28" y="52" width="240" height="198" rx="16" fill="#111c26" stroke="#223444" stroke-width="1.2"/>
  <rect x="44" y="68" width="28" height="28" rx="8" fill="#2b1620" stroke="#7f1d1d" stroke-width="1"/>
  <text x="58" y="87" text-anchor="middle" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">1</text>
  <text x="82" y="87" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Scam Received</text>

  <rect x="44" y="108" width="208" height="72" rx="10" fill="#18121a" stroke="#4c1d2e" stroke-width="1"/>
