  <text x="56" y="147" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">"Urgent: Pay AED 450 fine</text>
  <text x="56" y="164" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">or license will be suspended"</text>

  <rect x="44" y="196" width="208" height="38" rx="9" fill="#0c151d" stroke="#1e303e" stroke-width="1"/>
  <text x="148" y="213" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Resident checks it inside</text>
  <text x="148" y="227" text-anchor="middle" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ScamHisn AI in the TAMM App</text>

